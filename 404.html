<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b2a4a">
<meta http-equiv="Cache-Control" content="no-cache, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>請求・キャッシュ管理</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif; background: #f4f6f9; color: #1f2933; font-size: 14px; -webkit-text-size-adjust: 100%; }
  a { color: #2864f0; }
  .topbar { background: #1b2a4a; color: #ffffff; padding: 0 16px; height: 52px; display: flex; align-items: center; gap: 14px; position: sticky; top: 0; z-index: 30; }
  .topbar .logo { font-size: 15px; font-weight: 700; letter-spacing: .02em; }
  .coswitch { display: inline-flex; background: rgba(255,255,255,0.12); border-radius: 8px; padding: 3px; margin-left: auto; }
  .coswitch button { border: none; background: none; color: #c7d2e4; font-size: 12px; font-weight: 700; padding: 5px 12px; border-radius: 6px; cursor: pointer; white-space: nowrap; }
  .coswitch button.on { background: #ffffff; color: #1b2a4a; }
  .topbar .sync { background: none; border: 1px solid rgba(255,255,255,0.3); color: #ffffff; border-radius: 6px; font-size: 12px; padding: 5px 10px; cursor: pointer; }
  .shell { display: flex; min-height: calc(100vh - 52px); }
  nav.side { width: 190px; background: #ffffff; border-right: 1px solid #e1e6ed; padding: 10px 8px; flex-shrink: 0; }
  nav.side button { display: flex; align-items: center; gap: 9px; width: 100%; border: none; background: none; text-align: left; padding: 10px 12px; border-radius: 8px; font-size: 13.5px; font-weight: 600; color: #4a5768; cursor: pointer; margin-bottom: 2px; }
  nav.side button.on { background: #eaf1fe; color: #1b52c8; }
  nav.side button .ic { font-size: 15px; width: 18px; text-align: center; }
  nav.side .badge { margin-left: auto; background: #e5533d; color: #ffffff; font-size: 10px; font-weight: 700; border-radius: 99px; padding: 1px 6px; }
  main { flex: 1; padding: 18px; max-width: 1180px; }
  .card { background: #ffffff; border: 1px solid #e1e6ed; border-radius: 10px; padding: 16px; margin-bottom: 14px; }
  .card > h2 { font-size: 14px; font-weight: 700; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
  .card > h2 .sub { font-weight: 400; font-size: 11.5px; color: #7b8794; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .cohead { display: flex; align-items: baseline; gap: 8px; border-bottom: 2px solid #1b2a4a; padding-bottom: 7px; margin-bottom: 12px; }
  .cohead .nm { font-size: 14px; font-weight: 700; }
  .cohead .tag { font-size: 10.5px; color: #7b8794; }
  .kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; background: #e1e6ed; border: 1px solid #e1e6ed; border-radius: 8px; overflow: hidden; }
  .kpi { background: #ffffff; padding: 9px 10px; }
  .kpi .l { font-size: 10.5px; color: #7b8794; font-weight: 600; margin-bottom: 3px; }
  .kpi .v { font-size: 16px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .kpi .v.sm { font-size: 12.5px; font-weight: 600; }
  .plus { color: #0f9d58; } .minus { color: #e5533d; } .warn { color: #c77700; } .muted { color: #7b8794; }
  .netbox { margin-top: 12px; border: 1px solid #e1e6ed; border-radius: 8px; overflow: hidden; }
  .netbox .row { display: flex; justify-content: space-between; padding: 8px 12px; font-size: 12.5px; border-bottom: 1px solid #f0f3f7; }
  .netbox .row:last-child { border-bottom: none; }
  .netbox .row.total { background: #f7f9fc; font-weight: 700; font-size: 13.5px; }
  .netbox .row span:last-child { font-variant-numeric: tabular-nums; }
  .goal { margin-top: 12px; background: #eaf1fe; border-radius: 8px; padding: 10px 12px; }
  .goal .t { font-size: 11.5px; font-weight: 700; color: #1b52c8; }
  .goal .b { font-size: 15px; font-weight: 700; margin-top: 3px; }
  .bar { height: 6px; background: #d3e0f8; border-radius: 99px; margin-top: 7px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: #2864f0; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; color: #7b8794; font-size: 11px; font-weight: 700; padding: 7px 8px; border-bottom: 1px solid #e1e6ed; white-space: nowrap; background: #f9fafc; }
  td { padding: 9px 8px; border-bottom: 1px solid #f0f3f7; vertical-align: middle; }
  tr:hover td { background: #fafbfd; }
  .num { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .tablewrap { overflow-x: auto; margin: 0 -4px; }
  .pill { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 700; white-space: nowrap; border: 1px solid transparent; }
  .p-gray { background: #f0f3f7; color: #5a6673; border-color: #dfe4eb; }
  .p-blue { background: #eaf1fe; color: #1b52c8; border-color: #cddcfb; }
  .p-green { background: #e6f6ec; color: #0b7a3e; border-color: #c5e9d3; }
  .p-red { background: #fdecea; color: #b3251a; border-color: #f7cdc8; }
  .p-amber { background: #fdf3e0; color: #96610a; border-color: #f5e0b8; }
  .btn { border: none; border-radius: 7px; padding: 8px 15px; font-size: 13px; font-weight: 700; cursor: pointer; background: #2864f0; color: #ffffff; }
  .btn:active { opacity: .8; }
  .btn.sub { background: #ffffff; color: #3b4757; border: 1px solid #d3d9e2; }
  .btn.green { background: #0f9d58; }
  .btn.red { background: #ffffff; color: #b3251a; border: 1px solid #f2c9c4; }
  .btn.mini { padding: 4px 10px; font-size: 11.5px; border-radius: 6px; }
  .form-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(148px, 1fr)); gap: 9px; }
  label.f { display: block; font-size: 11px; font-weight: 700; color: #5a6673; }
  label.f input, label.f select, label.f textarea { width: 100%; margin-top: 4px; padding: 8px 9px; border: 1px solid #d3d9e2; border-radius: 7px; font-size: 14px; background: #ffffff; color: #1f2933; font-family: inherit; }
  label.f input:focus, label.f select:focus { outline: 2px solid #bcd2fb; border-color: #2864f0; }
  .seg { display: inline-flex; border: 1px solid #d3d9e2; border-radius: 7px; overflow: hidden; background: #ffffff; }
  .seg button { border: none; background: none; padding: 7px 13px; font-size: 12.5px; font-weight: 700; color: #5a6673; cursor: pointer; border-right: 1px solid #eef1f5; }
  .seg button:last-child { border-right: none; }
  .seg button.on { background: #2864f0; color: #ffffff; }
  .row-actions { display: flex; gap: 5px; flex-wrap: wrap; }
  .empty { color: #9aa5b1; text-align: center; padding: 22px; font-size: 13px; }
  .reccard { border: 1px solid #e1e6ed; border-radius: 9px; padding: 11px; margin-bottom: 9px; }
  .reccard.out { border-left: 3px solid #e5533d; }
  .reccard.in { border-left: 3px solid #0f9d58; }
  #busy { position: fixed; top: 0; left: 0; right: 0; height: 3px; background: #2864f0; display: none; z-index: 99; }
  #toast { position: fixed; bottom: 78px; left: 50%; transform: translateX(-50%); background: #1b2a4a; color: #ffffff; padding: 10px 18px; border-radius: 8px; font-size: 13px; display: none; z-index: 99; max-width: 90%; box-shadow: 0 4px 14px rgba(0,0,0,.2); }
  .modal-bg { position: fixed; inset: 0; background: rgba(27,42,74,0.45); display: none; z-index: 50; align-items: flex-start; justify-content: center; padding: 20px; overflow: auto; }
  .modal { background: #ffffff; border-radius: 10px; padding: 18px; width: 100%; max-width: 540px; }
  .modal h3 { font-size: 14px; margin-bottom: 12px; }
  .steps { font-size: 12px; line-height: 1.75; color: #4a5768; margin-bottom: 10px; }
  .balrow { display: flex; align-items: center; gap: 9px; margin-bottom: 6px; }
  .balrow .name { font-size: 13px; flex: 1; }
  .balrow input.amt { width: 130px; padding: 6px 8px; border: 1px solid #d3d9e2; border-radius: 7px; text-align: right; font-size: 14px; }
  textarea.paste { min-height: 108px; font-family: ui-monospace, monospace; font-size: 12px; }
  @media (max-width: 900px) {
    .topbar { height: auto; min-height: 52px; flex-wrap: wrap; padding: 8px 12px; gap: 8px; }
    .topbar .logo { font-size: 14px; white-space: nowrap; }
    .topbar .sync { padding: 5px 8px; font-size: 11px; }
    #stale { font-size: 10px !important; }
    .coswitch { order: 9; margin-left: 0; width: 100%; }
    .coswitch button { flex: 1; padding: 6px 2px; font-size: 11px; text-align: center; }
    .kpis { grid-template-columns: repeat(2, 1fr) !important; }
    .kpi .v { font-size: 15px; }
    .cohead { flex-wrap: wrap; gap: 4px; }
    .card { padding: 12px; }
    .card > h2 { flex-wrap: wrap; }
    table { font-size: 12px; }
    th, td { padding: 6px 5px; }
    .netbox .row { font-size: 12px; }
    .form-grid { grid-template-columns: 1fr 1fr; }
    .lg { display: none; }
    nav.side { width: auto !important; overflow: hidden; }
    nav.side button { flex: 1 1 0 !important; min-width: 0 !important; font-size: 9.5px !important; padding: 6px 1px !important; }
    nav.side button .ic { font-size: 16px !important; width: auto !important; }
    nav.side .badge { font-size: 9px; padding: 0 4px; }
    label.f input, label.f select { font-size: 16px; }
  }
  @media (max-width: 900px) {
    main { padding: 12px; padding-bottom: 76px; }
    .grid2 { grid-template-columns: 1fr; }
    nav.side { position: fixed; bottom: 0; left: 0; right: 0; width: auto; display: flex; border-right: none; border-top: 1px solid #e1e6ed; padding: 4px; z-index: 20; }
    nav.side button { flex-direction: column; gap: 2px; font-size: 10px; padding: 6px 2px; justify-content: center; }
    nav.side button .ic { font-size: 17px; }
    nav.side .badge { position: absolute; margin: 0; transform: translate(14px, -6px); }
  }

  /* --- スマホ最終調整（他のルールより後に置いて確実に効かせる） --- */
  @media (max-width: 900px) {
    html, body { max-width: 100%; overflow-x: hidden; }
    .shell { display: block; }
    main { max-width: 100%; width: 100%; padding: 10px; padding-bottom: 84px; }
    nav.side {
      position: fixed; bottom: 0; left: 0;
      width: 100vw !important; max-width: 100vw;
      display: flex; flex-wrap: nowrap;
      border-right: none; border-top: 1px solid #e1e6ed;
      padding: 4px 2px; z-index: 20; background: #ffffff;
      padding-bottom: calc(4px + env(safe-area-inset-bottom));
    }
    .card, .grid2, section { max-width: 100%; }
    .grid2 { grid-template-columns: 1fr !important; }
  }
</style>
</head>
<body>
<div id="busy"></div>
<div class="topbar">
  <span class="logo">請求・キャッシュ</span>
  <span class="coswitch" id="coswitch"></span>
  <button class="sync" onclick="openReport()">📊 シート</button>
  <span id="stale" style="display:none;font-size:11px;background:rgba(255,255,255,.18);padding:3px 8px;border-radius:99px">最新を取得中…</span> <button class="sync" onclick="reload_()">更新</button>
</div>
<div class="shell">
  <nav class="side" id="nav"></nav>
  <main>
    <section id="sec-cash"></section>
    <section id="sec-inv" style="display:none"></section>
    <section id="sec-bill" style="display:none"></section>
    <section id="sec-payA" style="display:none"></section>
    <section id="sec-payB" style="display:none"></section>
    <section id="sec-rec" style="display:none"></section>
    <section id="sec-pl" style="display:none"></section>
    <section id="sec-cfg" style="display:none"></section>
  </main>
</div>
<div class="modal-bg" id="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal" id="modal-body"></div></div>
<div id="toast"></div>

<script>
var BUILD = '202610091602';
var DEPLOY_ID = 'AKfycbwSE7kfAV7avEunTPzP9drNLq55iIXkeeE2Bi14S_BpREw1IrKlEvfqTrZ6g6kr3-rUYQ';
// Chromeが複数Googleアカウントにログインしていると /macros/s/ がWorkspace用URLへ転送されて失敗する。
// その場合に備えて順に試す。成功したものを記憶して以後それを使う。
var API_BASES = [
  'https://script.google.com/macros/s/' + DEPLOY_ID + '/exec',
  'https://script.google.com/a/macros/taisyoku-smile.com/s/' + DEPLOY_ID + '/exec'
];
var API = (function () {
  try { var v = localStorage.getItem('bk_api'); if (v && API_BASES.indexOf(v) >= 0) return v; } catch (e) {}
  return API_BASES[0];
})();
var WH = (function () {
  var m = location.search.match(/[?&]wh=([^&]+)/);
  if (m) { try { localStorage.setItem('bk_wh', decodeURIComponent(m[1])); } catch (e) {} return decodeURIComponent(m[1]); }
  try { return localStorage.getItem('bk_wh') || ''; } catch (e) { return ''; }
})();
var DATA = { invoices: [], bills: [], txns: [], balances: [], settings: {}, catRules: [], pl: null, freee: {}, serverTime: '' };
var TAB = 'cash';
var CO = 'ALL';
var FILTER = { inv: 'ALL', bill: 'ALL' };
var FREEE_COMPANIES = { A: [], B: [] };
var FREEE_WALLETS = { A: [], B: [] };
var TABS = [['cash', '🏠', 'ホーム'], ['payA', '🏦', 'さすが宛'], ['payB', '🏦', 'Kiraku宛'], ['cfg', '⚙️', '設定']];

function $(id) { return document.getElementById(id); }
function esc(s) { return String(s === undefined || s === null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
function yen(n) { return '¥' + Number(n || 0).toLocaleString(); }
function d2s(d) { return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2); }
function todayStr() { return d2s(new Date()); }
function ym() { return todayStr().slice(0, 7); }
function coName(c) { return DATA.settings['会社' + c + '名'] || ({ A: '株式会社さすが', B: '株式会社Kiraku' })[c] || c; }
function cos() { return CO === 'ALL' ? ['A', 'B'] : [CO]; }
function inScope(x) { return CO === 'ALL' || x['会社'] === CO; }
function toast(msg) { var t = $('toast'); t.textContent = msg; t.style.display = 'block'; clearTimeout(t._h); t._h = setTimeout(function () { t.style.display = 'none'; }, 3400); }
function busy(on) { $('busy').style.display = on ? 'block' : 'none'; }
var _jsonpSeq = 0;
function jsonp(fn, args) {
  // 1本目で失敗したらもう1本のURLを試す
  return jsonpOn(API, fn, args).catch(function (e1) {
    var other = API_BASES.filter(function (b) { return b !== API; })[0];
    if (!other) throw e1;
    return jsonpOn(other, fn, args).then(function (r) {
      API = other;
      try { localStorage.setItem('bk_api', other); } catch (e) {}
      return r;
    });
  });
}
function jsonpOn(base, fn, args) {
  return new Promise(function (resolve, reject) {
    var cb = 'bkcb' + (++_jsonpSeq) + '_' + Date.now();
    var sc = document.createElement('script');
    var done = false;
    var timer = setTimeout(function () {
      if (done) return;
      done = true;
      cleanup();
      reject(new Error('タイムアウト'));
    }, 120000);
    function cleanup() {
      clearTimeout(timer);
      try { delete window[cb]; } catch (e) { window[cb] = undefined; }
      if (sc.parentNode) sc.parentNode.removeChild(sc);
    }
    window[cb] = function (res) {
      if (done) return;
      done = true;
      cleanup();
      if (res && res.error) reject(new Error(res.error));
      else resolve(res ? res.result : null);
    };
    var url = base + '?callback=' + cb + '&wh=' + encodeURIComponent(WH) + '&fn=' + encodeURIComponent(fn)
      + '&args=' + encodeURIComponent(JSON.stringify(args || []));
    sc.src = url;
    sc.onerror = function () {
      if (done) return;
      done = true;
      cleanup();
      reject(new Error('読み込みに失敗しました'));
    };
    document.body.appendChild(sc);
  });
}
function run(fn) {
  var args = Array.prototype.slice.call(arguments, 1);
  busy(true);
  return jsonp(fn, args).then(function (r) { busy(false); return r; })
    .catch(function (e) { busy(false); toast('エラー: ' + e.message); throw e; });
}
function applyData(json) { DATA = JSON.parse(json); try { localStorage.setItem('bk_data', json); } catch (e) {} renderAll(); }
function reload_() { markStale(true); run('getData').then(function (j) { applyData(j); markStale(false); toast('最新にしました'); }); }

function freeeReady(co) { return !!(DATA.freee && DATA.freee[co] && DATA.freee[co].hasToken); }
function liveInv() { return DATA.invoices.filter(function (v) { return v['状態'] !== '取消'; }); }
function liveBill() { return (DATA.bills || []).filter(function (b) { return b['状態'] !== '取消'; }); }
function invStatus(v) { return (v['状態'] === '発行済' && v['入金期日'] && v['入金期日'] < todayStr()) ? '期日超過' : v['状態']; }
function billStatus(b) { return (b['状態'] === '未払' && b['支払期日'] && b['支払期日'] < todayStr()) ? '期日超過' : b['状態']; }
function pill(s) {
  var c = { '未発行': 'p-amber', '発行済': 'p-blue', '入金済': 'p-green', '期日超過': 'p-red', '未払': 'p-amber', '支払済': 'p-green', '取消': 'p-gray', '要承認': 'p-red', '要確認': 'p-amber' }[s] || 'p-gray';
  return '<span class="pill ' + c + '">' + esc(s) + '</span>';
}
function alertCount() {
  var t = todayStr(), n = 0;
  liveInv().filter(inScope).forEach(function (v) {
    if (v['状態'] === '未発行' && v['請求予定日'] && v['請求予定日'] <= t) n++;
    if (v['状態'] === '発行済' && v['入金期日'] && v['入金期日'] < t) n++;
  });
  liveBill().filter(inScope).forEach(function (b) {
    if (b['状態'] === '未払' && b['支払期日'] && b['支払期日'] < t) n++;
  });
  return n;
}
function payCount(co) {
  var lim = d2s(new Date(Date.now() + 7 * 86400000));
  return liveBill().filter(function (b) { return !co || b['会社'] === co; }).filter(function (b) {
    return (b['状態'] === '未払' || b['状態'] === '要承認') && Number(b['金額']) > 0 && b['支払期日'] && b['支払期日'] <= lim;
  }).length;
}
function billCount() {
  return liveBill().filter(inScope).filter(function (b) { return b['状態'] === '要確認' || b['状態'] === '要承認'; }).length;
}
function pendingTxns() { return DATA.txns.filter(function (t) { return t['状態'] === '未処理'; }); }

/* ---------- 指標 ---------- */
function metrics(co) {
  var m = ym(), t = todayStr();
  var invs = liveInv().filter(function (v) { return v['会社'] === co; });
  var bills = liveBill().filter(function (b) { return b['会社'] === co; });
  var bal = 0, cardBal = 0;
  DATA.balances.forEach(function (b) {
    if (b['会社'] !== co) return;
    if (String(b['口座']).indexOf('💳') === 0) cardBal += Number(b['残高']) || 0;
    else bal += Number(b['残高']) || 0;
  });
  var paidM = 0, expM = 0, ar = 0, arOverAmt = 0, arOverCnt = 0, grossM = 0;
  var samples = [];
  var d90 = d2s(new Date(Date.now() - 90 * 86400000));
  invs.forEach(function (v) {
    var amt = Number(v['金額']) || 0, gp = v['粗利'] === '' ? null : Number(v['粗利']) || 0;
    if (v['入金日'] && v['入金日'].slice(0, 7) === m) paidM += amt;
    if (v['状態'] === '発行済') {
      ar += amt;
      if (v['入金期日'] && v['入金期日'].slice(0, 7) === m) expM += amt;
      if (v['入金期日'] && v['入金期日'] < t) { arOverAmt += amt; arOverCnt++; }
    }
    if (v['発行日'] && v['発行日'].slice(0, 7) === m && gp !== null) grossM += gp;
    if (v['発行日'] && v['発行日'] >= d90 && gp !== null && gp > 0) samples.push(gp);
  });
  var ap = 0, apM = 0, apOverAmt = 0, apOverCnt = 0, paidOutM = 0;
  bills.forEach(function (b) {
    var amt = Number(b['金額']) || 0;
    if (b['状態'] === '未払') {
      ap += amt;
      if (b['支払期日'] && b['支払期日'].slice(0, 7) === m) apM += amt;
      if (b['支払期日'] && b['支払期日'] < t) { apOverAmt += amt; apOverCnt++; }
    }
    if (b['支払日'] && b['支払日'].slice(0, 7) === m) paidOutM += amt;
  });
  var fixed = Number(DATA.settings[co + '_固定費月']) || 0;
  var target = Number(DATA.settings[co + '_粗利目標月']) || 0;
  var unitManual = Number(DATA.settings['平均粗利件単価_手動']) || 0;
  var unit = unitManual || (samples.length ? Math.round(samples.reduce(function (a, b) { return a + b; }, 0) / samples.length) : 0);
  var remain = Math.max(0, target - grossM);
  return {
    bal: bal, cardBal: cardBal, paidM: paidM, expM: expM, ar: ar, arOverAmt: arOverAmt, arOverCnt: arOverCnt,
    ap: ap, apM: apM, apOverAmt: apOverAmt, apOverCnt: apOverCnt, paidOutM: paidOutM,

  };
}

function simDefault() { var d = new Date(); return d2s(new Date(d.getFullYear(), d.getMonth() + 1, 0)); }
var SIMDATE = '';

function simCard() {
  if (!SIMDATE) SIMDATE = simDefault();
  var t = todayStr();
  var html = '<div class="card"><h2>💰 いつ時点の現金か <span class="sub">この日までの入金・支払を反映した見込み</span>'
    + '<input type="date" id="sim-date" value="' + esc(SIMDATE) + '" onchange="SIMDATE=this.value;renderCash()" '
    + 'style="margin-left:auto;padding:6px 9px;border:1px solid #d3d9e2;border-radius:7px;font-size:13px"></h2>';
  html += '<div class="tablewrap"><table><tr><th>会社</th><th class="num">今の現金</th>'
    + '<th class="num">＋ 入金予定</th><th class="num">− 支払予定</th><th class="num">− クレカ</th>'
    + '<th class="num">' + esc(SIMDATE) + ' の見込み</th></tr>';
  var tot = { bal: 0, inc: 0, pay: 0, card: 0 };
  cos().forEach(function (co) {
    var bal = 0, card = 0;
    DATA.balances.forEach(function (b) {
      if (b['会社'] !== co) return;
      if (String(b['口座']).indexOf('💳') === 0) card += Number(b['残高']) || 0;
      else bal += Number(b['残高']) || 0;
    });
    var inc = 0, pay = 0;
    liveInv().forEach(function (v) {
      if (v['会社'] !== co || v['状態'] !== '発行済') return;
      if (v['入金期日'] && v['入金期日'] <= SIMDATE) inc += Number(v['金額']) || 0;
    });
    liveBill().forEach(function (b) {
      if (b['会社'] !== co) return;
      if (b['状態'] !== '未払' && b['状態'] !== '要承認') return;
      if (!b['支払期日'] || b['支払期日'] > SIMDATE) return;
      var amt = Number(b['金額']) || 0;
      if (String(b['費目']) === 'クレジットカード') card += amt; else pay += amt;
    });
    var end = bal + inc - pay - card;
    tot.bal += bal; tot.inc += inc; tot.pay += pay; tot.card += card;
    html += '<tr><td><b>' + esc(coName(co)) + '</b></td>'
      + '<td class="num">' + yen(bal) + '</td>'
      + '<td class="num plus">' + (inc ? '+' + yen(inc) : '—') + '</td>'
      + '<td class="num minus">' + (pay ? '−' + yen(pay) : '—') + '</td>'
      + '<td class="num minus">' + (card ? '−' + yen(card) : '—') + '</td>'
      + '<td class="num" style="font-weight:700;font-size:15px' + (end < 0 ? ';color:#e5533d' : '') + '">' + yen(end) + '</td></tr>';
  });
  if (cos().length > 1) {
    var e2 = tot.bal + tot.inc - tot.pay - tot.card;
    html += '<tr style="background:#f7f9fc"><td><b>合計</b></td><td class="num"><b>' + yen(tot.bal) + '</b></td>'
      + '<td class="num plus">' + (tot.inc ? '+' + yen(tot.inc) : '—') + '</td>'
      + '<td class="num minus">' + (tot.pay ? '−' + yen(tot.pay) : '—') + '</td>'
      + '<td class="num minus">' + (tot.card ? '−' + yen(tot.card) : '—') + '</td>'
      + '<td class="num" style="font-weight:700;font-size:15px' + (e2 < 0 ? ';color:#e5533d' : '') + '">' + yen(e2) + '</td></tr>';
  }
  html += '</table></div>';
  var noDue = liveBill().filter(inScope).filter(function (b) { return (b['状態'] === '未払' || b['状態'] === '要承認') && !b['支払期日']; });
  if (noDue.length) html += '<div class="muted" style="font-size:11px;margin-top:7px">※支払期日が未入力の ' + noDue.length + '件は計算に入っていません（支払タブで期日を入れてください）</div>';
  return html + '</div>';
}

/** 請求書からコピペした文字列を、銀行名・支店・種別・口座番号・名義に分解する。
 *  書式がバラバラ（ラベルあり/なし・順不同・全角/半角）なので、項目ごとに独立して探す。 */
function parseBank(src) {
  var t = String(src || '')
    .replace(/[０-９]/g, function (c) { return String.fromCharCode(c.charCodeAt(0) - 0xFEE0); })
    .replace(/[Ａ-Ｚａ-ｚ]/g, function (c) { return String.fromCharCode(c.charCodeAt(0) - 0xFEE0); })
    .replace(/　/g, ' ');
  var out = { 銀行名: '', 支店名: '', 口座種別: '', 口座番号: '', 口座名義: '' };

  var mb = t.match(/([ぁ-んァ-ヶ一-龥A-Za-z][ぁ-んァ-ヶー一-龥A-Za-z0-9]{0,15}?(?:銀行|信用金庫|信金|信用組合|労働金庫|農業協同組合))/);
  if (mb) out.銀行名 = mb[1].replace(/^(?:銀行名|金融機関名?)[:：]?/, '');

  var ms = t.match(/([ぁ-んァ-ヶ一-龥A-Za-z0-9][ぁ-んァ-ヶー一-龥A-Za-z0-9]{0,13}?(?:支店|営業部|出張所|支社))/);
  if (ms && ms[1] !== out.銀行名) out.支店名 = ms[1].replace(/^(?:支店名|店名)[:：]?/, '');
  else if (/本店/.test(t) && !out.支店名) out.支店名 = '本店';

  var mk = t.match(/(普通|当座|貯蓄)/);
  if (mk) out.口座種別 = mk[1];

  // 口座番号：ラベル優先。なければ種別の近く。銀行コード(4桁)・支店コード(3桁)と混ざらないよう6桁以上に限定。
  var mn = t.match(/(?:口座番号|口座No|アカウント番号)[^0-9]{0,8}(\d{6,8})(?!\d)/);
  if (!mn) mn = t.match(/(?:普通|当座|貯蓄)(?:預金)?[^0-9]{0,10}(\d{6,8})(?!\d)/);
  if (!mn) mn = t.match(/(\d{6,8})(?!\d)/);
  if (mn) out.口座番号 = mn[1];

  var mh = t.match(/(?:口座名義(?:人)?|名義(?:人)?|受取人)[:：]?\s*([^\n]{2,40})/);
  if (mh) out.口座名義 = mh[1].trim();
  if (!out.口座名義) {
    // 銀行名・支店名と、読み仮名や金融機関コードが入った括弧を先に取り除く。
    // そうしないと「三井住友銀行（ﾐﾂｲｽﾐﾄﾓ 0009）」の読みを名義として拾ってしまう。
    var rest = t;
    if (out.銀行名) rest = rest.split(out.銀行名).join('\n');
    if (out.支店名) rest = rest.split(out.支店名).join('\n');
    rest = rest.replace(/[（(][^)）]*\d[^)）]*[)）]/g, '\n');
    // カナの名義は「カ）ネツトプロテクシヨンズ」のように略号＋閉じ括弧で始まることがあるので、
    // 候補を全部拾って一番長いものを採る。
    var cands = (rest.match(/(?:[ｦ-ﾟ]|[ァ-ヶ])[ｦ-ﾟァ-ヶー 　]{0,30}(?:[\)）][ｦ-ﾟァ-ヶー 　]{0,30})?/g) || [])
      .map(function (x) { return x.trim(); })
      .filter(function (x) { return x.length >= 3; })
      .sort(function (a, b) { return b.length - a.length; });
    if (cands.length) {
      var hit = cands[0];
      var at = rest.indexOf(hit);
      var pre = rest.slice(Math.max(0, at - 4), at);
      out.口座名義 = (/株式会社|合同会社|有限会社/.test(pre) ? pre.slice(-4) : '') + hit;
    }
    if (!out.口座名義) {
      var mh3 = rest.match(/((?:株式会社|合同会社|有限会社|合資会社)[^\s\n（(]{1,24}|[^\s\n（(]{1,24}(?:株式会社|合同会社|有限会社))/);
      if (mh3) out.口座名義 = mh3[1].trim();
    }
  }
  out.口座名義 = String(out.口座名義).replace(/^[:：\s]+/, '').slice(0, 40);
  return out;
}

/** 支店番号（3桁）が拾えれば支店名に添える。例「東京中央支店（593）」 */
function branchWithCode(src, branch) {
  if (!branch) return '';
  var t = String(src || '').replace(/[０-９]/g, function (c) { return String.fromCharCode(c.charCodeAt(0) - 0xFEE0); });
  var re = new RegExp(branch.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '\\s*[（(]\\s*[^)）]*?(\\d{3})\\s*[)）]');
  var m = t.match(re);
  if (!m) { var m2 = t.match(/(?:支店番号|店番号?)[^0-9]{0,4}(\d{3})(?!\d)/); if (m2) return branch + '（' + m2[1] + '）'; }
  return m ? branch + '（' + m[1] + '）' : branch;
}

function applyPaste() {
  var src = ($('bk-paste') || {}).value || '';
  if (!src.trim()) { toast('振込先の文字をまず貼ってください'); return; }
  var p = parseBank(src);
  if (p.銀行名) $('bk-銀行名').value = p.銀行名;
  if (p.支店名) $('bk-支店名').value = branchWithCode(src, p.支店名);
  if (p.口座種別) $('bk-口座種別').value = p.口座種別;
  if (p.口座番号) $('bk-口座番号').value = p.口座番号;
  if (p.口座名義) $('bk-口座名義').value = p.口座名義;
  var miss = [];
  if (!p.銀行名) miss.push('銀行名');
  if (!p.口座番号) miss.push('口座番号');
  $('bk-warn').innerHTML = miss.length
    ? '<div class="minus" style="font-size:12px">' + miss.join('と') + 'が読み取れませんでした。手で入れてください。</div>'
    : '<div style="font-size:12px;color:#1a7f37">読み取れました。内容を確かめて保存してください。</div>';
}

function saveBank(id) {
  var bank = {
    銀行名: ($('bk-銀行名').value || '').trim(),
    支店名: ($('bk-支店名').value || '').trim(),
    口座種別: $('bk-口座種別').value || '普通',
    口座番号: ($('bk-口座番号').value || '').replace(/[^0-9]/g, ''),
    口座名義: ($('bk-口座名義').value || '').trim()
  };
  if (!bank.銀行名 || !bank.口座番号) {
    $('bk-warn').innerHTML = '<div class="minus" style="font-size:12px">銀行名と口座番号は必ず入れてください（間違った振込先を出さないため）。</div>';
    return;
  }
  if (!/^\d{6,8}$/.test(bank.口座番号)) {
    $('bk-warn').innerHTML = '<div class="minus" style="font-size:12px">口座番号は6〜8桁の数字です。確かめてください。</div>';
    return;
  }
  var payee = '';
  DATA.bills.forEach(function (x) { if (x.id === id) payee = x['支払先']; });
  closeModal();
  toast('振込先を保存しています…');
  run('updateBill', id, bank).then(function () {
    return run('savePayeeBank', payee, JSON.stringify(bank), true);
  }).then(function (j) {
    var r = JSON.parse(j);
    DATA = r.data; renderAll(); toast(r.result);
  });
}

function clearBank(id) {
  closeModal();
  run('updateBill', id, { 銀行名: '', 支店名: '', 口座種別: '', 口座番号: '', 口座名義: '' })

function parseLine(line) {
  var parts = line.split(/[\t,]/).map(function (s) { return s.replace(/^"|"$/g, '').trim(); });
  if (parts.length < 2) return null;
  var date = '', nums = [], descs = [];
  parts.forEach(function (p) {
    var dm = p.match(/^(\d{4})[\/\-年](\d{1,2})[\/\-月](\d{1,2})/);
    if (dm && !date) { date = dm[1] + '-' + ('0' + dm[2]).slice(-2) + '-' + ('0' + dm[3]).slice(-2); return; }
    var n = p.replace(/[¥,円\s]/g, '');
    if (/^\d+$/.test(n) && Number(n) > 0) { nums.push(Number(n)); return; }
    if (p) descs.push(p);
  });
  if (!date || !nums.length) return null;
  return { 日付: date, 金額: nums[0], 摘要: descs.join(' ') };
}
function pasteTxns() {
  var list = [];
  $('p-text').value.split('\n').map(function (s) { return s.trim(); }).filter(Boolean).forEach(function (l) {

function guessCat(text) {
  var hay = String(text || '').toLowerCase();
  var learned = DATA.catRules || [];
  for (var L = 0; L < learned.length; L++) {
    if (learned[L][0] && hay.indexOf(String(learned[L][0]).toLowerCase()) >= 0) return learned[L][1];
  }
  for (var i = 0; i < CAT_RULES.length; i++) {
    for (var j = 0; j < CAT_RULES[i][1].length; j++) {
      if (hay.indexOf(CAT_RULES[i][1][j]) >= 0) return CAT_RULES[i][0];
    }
  }
  return 'その他';
}
function lastMonths(n) {
  var out = [], d = new Date();
  for (var i = n - 1; i >= 0; i--) {
    var m = new Date(d.getFullYear(), d.getMonth() - i, 1);
    out.push(m.getFullYear() + '-' + ('0' + (m.getMonth() + 1)).slice(-2));
  }
  return out;
}

    h += '</div><div style="margin-top:8px"><div style="font-size:11px;font-weight:700;color:#5a6673;margin-bottom:5px">請求書作成の設定</div>'
      + '<div id="f-inv-' + co + '">'
      + (cur.salesAccountItemId ? '<div class="muted" style="font-size:11px">勘定科目ID ' + esc(cur.salesAccountItemId) + ' / 税区分 ' + esc(cur.taxCode || '未設定') + '</div>' : '<div class="muted" style="font-size:11px">未設定でも作成は試みます</div>')
      + '</div><button class="btn mini sub" style="margin-top:5px" onclick="fLoadInvOpts(\'' + co + '\')">勘定科目・税区分を読み込む</button></div></div>';
  }
  return h + '</div>';
}

function fSaveApp(co) {
  var cid = $('f-cid-' + co).value.trim();
  if (!cid || cid.indexOf('設定済み') === 0) { toast('Client IDを入れてください'); return; }
  run('saveFreeeApp', co, cid, $('f-csec-' + co).value.trim(), 'http://localhost:8089/callback')
    .then(function (j) { applyData(j); toast('保存しました。認可ページを開いてください'); });
}
function fConnect(co) {
  var v = $('f-code-' + co).value.trim();
  if (!v) { toast('認可コードかURLを貼ってください'); return; }
  run('freeeExchangeCode', co, v).then(function (j) {
    var r = JSON.parse(j);
    FREEE_COMPANIES[co] = r.companies; DATA = r.data;
    renderAll(); showTab('cfg');
    toast(coName(co) + ' 接続成功！事業所と口座を選んでください');
  });
}
function fLoadCompanies(co) {
  run('freeeCompanies', co).then(function (j) {
    var r = JSON.parse(j); FREEE_COMPANIES[co] = r.companies; DATA = r.data; renderAll(); showTab('cfg');
  });
}
function fLoadWallets(co) {
  var cid = $('f-sel-' + co).value;
  if (!cid) return;
  run('freeeWallets', co, cid).then(function (j) {
    var r = JSON.parse(j); FREEE_WALLETS[co] = r.wallets;
    var cur = (DATA.freee.map && DATA.freee.map[co] && DATA.freee.map[co].wallets) || [];
    var keys = cur.map(function (w) { return w.type + ':' + w.id; });
    var h = '';
    r.wallets.forEach(function (w, i) {
      h += '<label style="display:flex;gap:6px;align-items:center;font-size:12px;margin-bottom:4px">'
        + '<input type="checkbox" id="f-w-' + co + '-' + i + '" ' + (keys.indexOf(w.type + ':' + w.id) >= 0 ? 'checked' : '') + '>'
        + esc(w.name) + '（' + yen(w.balance) + (w.sync && w.sync !== 'success' ? ' ⚠同期停止' : '') + '）</label>';
    });
    $('f-wallets-' + co).innerHTML = h || '<div class="muted" style="font-size:11px">口座がありません</div>';
  });
}
function fLoadInvOpts(co) {
  var cid = $('f-sel-' + co).value || ((DATA.freee.map && DATA.freee.map[co]) || {}).companyId;
  if (!cid) { toast('先に事業所を選んでください'); return; }
  run('freeeInvoiceOptions', co, cid).then(function (j) {
    var r = JSON.parse(j);
    var cur = (DATA.freee.map && DATA.freee.map[co]) || {};
    var h = '<label class="f">売上の勘定科目<select id="f-acc-' + co + '"><option value="">（指定しない）</option>';
    r.accountItems.forEach(function (a) { h += '<option value="' + a.id + '" ' + (String(cur.salesAccountItemId) === String(a.id) ? 'selected' : '') + '>' + esc(a.name) + '</option>'; });
    h += '</select></label><label class="f" style="margin-top:5px">税区分<select id="f-tax-' + co + '"><option value="">（指定しない）</option>';
    r.taxes.forEach(function (t) { h += '<option value="' + t.code + '" ' + (String(cur.taxCode) === String(t.code) ? 'selected' : '') + '>' + esc(t.name) + '</option>'; });
    h += '</select></label>';
    if (!r.accountItems.length && !r.taxes.length) h = '<div class="muted" style="font-size:11px">取得できませんでした。未設定のまま作成を試せます</div>';
    $('f-inv-' + co).innerHTML = h;
  });
}
function fSaveMap() {
  var map = JSON.parse(JSON.stringify(DATA.freee.map || {}));
  ['A', 'B'].forEach(function (co) {
    var sel = $('f-sel-' + co);
    var prev = map[co] || {};
    var cid = (sel && sel.value) || prev.companyId;
    if (!cid) return;
    var nm = (sel && sel.value) ? sel.options[sel.selectedIndex].text : (prev.companyName || '');
    var ws = [];
    (FREEE_WALLETS[co] || []).forEach(function (w, i) { var cb = $('f-w-' + co + '-' + i); if (cb && cb.checked) ws.push({ id: w.id, type: w.type, name: w.name }); });
    if (!ws.length && prev.wallets) ws = prev.wallets;
    var acc = $('f-acc-' + co), tax = $('f-tax-' + co);
    map[co] = {
      companyId: cid, companyName: nm, wallets: ws,
      salesAccountItemId: acc ? acc.value : (prev.salesAccountItemId || ''),
      taxCode: tax ? tax.value : (prev.taxCode || '')
    };
  });
  run('saveFreeeMap', JSON.stringify(map)).then(function (j) { applyData(j); toast('設定を保存しました'); });
}
function fSyncNow() { run('syncFreeeNow').then(function (j) { var r = JSON.parse(j); DATA = r.data; renderAll(); toast('同期完了: ' + r.result); }); }

/* ---------- 共通 ---------- */
function openReport() {
  run('buildReport').then(function (j) {
    var r = JSON.parse(j);
    DATA = r.data; renderAll();
    window.open(r.url, '_blank');
    toast(r.result);
  });
}
function openModal(h) { $('modal-body').innerHTML = h; $('modal-bg').style.display = 'flex'; }
function closeModal() { $('modal-bg').style.display = 'none'; }
function showTab(t) {
  TAB = t;
  if (!RENDERED[t]) renderView(t);
  TABS.forEach(function (x) { $('sec-' + x[0]).style.display = x[0] === t ? 'block' : 'none'; });
  renderNav();
  window.scrollTo(0, 0);
}
function setCo(c) { CO = c; RENDERED = {}; renderNav(); renderView(TAB); }
function shortCo(c) { return String(coName(c)).replace(/株式会社|有限会社|合同会社|\(株\)|（株）/g, '').trim() || coName(c); }
function renderNav() {
  var n = alertCount(), p = pendingTxns().filter(inScope).length;
  var h = '';
  TABS.forEach(function (x) {
    var b = (x[0] === 'cash' && n) ? n : (x[0] === 'payA') ? payCount('A') : (x[0] === 'payB') ? payCount('B') : 0;
    var lbl = x[0] === 'payA' ? shortCo('A') + '宛' : x[0] === 'payB' ? shortCo('B') + '宛' : x[2];
    h += '<button class="' + (TAB === x[0] ? 'on' : '') + '" onclick="showTab(\'' + x[0] + '\')"><span class="ic">' + x[1] + '</span>' + esc(lbl) + (b ? '<span class="badge">' + b + '</span>' : '') + '</button>';
  });
  $('nav').innerHTML = h;
  var c = '';
  if (TAB === 'cash' || TAB === 'cfg') {
    [['ALL', '全社'], ['A', coName('A')], ['B', coName('B')]].forEach(function (x) {
      c += '<button class="' + (CO === x[0] ? 'on' : '') + '" onclick="setCo(\'' + x[0] + '\')">' + esc(x[1]) + '</button>';
    });
  }
  $('coswitch').innerHTML = c;
}
var RENDERERS = { cash: function () { renderCash(); }, payA: function () { renderPay('A'); }, payB: function () { renderPay('B'); }, cfg: function () { renderCfg(); } };
var RENDERED = {};
function renderView(t) {
  if (!RENDERERS[t]) return;
  RENDERERS[t]();
  RENDERED[t] = true;
}
function renderAll() { RENDERED = {}; renderNav(); renderView(TAB); }
function showErr(t) {
  var el = document.getElementById('sec-cash');
  if (el) el.innerHTML = '<div class="card"><h2>画面エラー</h2><pre style="white-space:pre-wrap;color:#b3251a;font-size:12px">' + t + '</pre></div>';
}
window.onerror = function (m, s, l, c) { showErr(m + '\n@' + l + ':' + c); };
function applyAndCache(json) {
  try { localStorage.setItem('bk_data', json); } catch (e) {}
  applyData(json);
}
function boot() {
  if (!WH) { showErr('合言葉がありません。URLの末尾に ?wh=合言葉 を付けて開いてください'); return; }
  var cached = null;
  try { cached = localStorage.getItem('bk_data'); } catch (e) {}
  if (cached) {
    try { DATA = JSON.parse(cached); renderAll(); markStale(true); } catch (e) {}
  } else {
    $('sec-cash').innerHTML = '<div class="card"><div class="empty">読み込んでいます…</div></div>';
    renderNav();
  }
  markStale(true);
  jsonp('getData', [])
    .then(function (r) { applyAndCache(r); markStale(false); })
    .catch(function (e) {
      markStale(false);
      if (!cached) showErr('データを取得できませんでした（' + e.message + '）\n\n'
        + '・Chromeで複数のGoogleアカウントにログインしていると弾かれることがあります。\n'
        + '　シークレットウィンドウで開くか、info@taisyoku-smile.com のみでログインしてお試しください。\n'
        + '・広告ブロッカー等の拡張機能が script.google.com を遮断している場合も同じ症状になります。');
    });
}
function markStale(on) {
  var el = $('stale');
  if (el) el.style.display = on ? 'inline-block' : 'none';
}
function checkUpdate() {
  fetch('version.txt?t=' + Date.now(), { cache: 'no-store' })
    .then(function (r) { return r.text(); })
    .then(function (t) {
      var latest = String(t).trim();
      if (!/^[0-9]{10,14}$/.test(latest)) return;   // version.txtが取れない時は何もしない
      if (latest === BUILD) return;
      var once = 'bk_reload_' + latest;
      try { if (sessionStorage.getItem(once)) return; sessionStorage.setItem(once, '1'); } catch (e) {}
      location.replace(location.pathname + location.search.replace(/[?&]v=[^&]*/, '') + (location.search ? '&' : '?') + 'v=' + latest);
    })
    .catch(function () {});
}
checkUpdate();
try { boot(); } catch (err) { showErr(err && err.stack ? err.stack : String(err)); }
</script>
</body>
